<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>材料阻抗 Smith 圆图</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div>
      <p class="eyebrow">MATERIAL IMPEDANCE LAB</p>
      <h1>材料阻抗 Smith 圆图</h1>
      <p class="subtitle">本征阻抗或有限厚度金属背板吸波层 · 完整 Smith 网格 · Origin 数据导出</p>
    </div>
    <div class="formula" aria-label="计算公式">
      <span id="formula-primary">z = √(μ<sub>r</sub> / ε<sub>r</sub>)</span>
      <span>Γ = (z − 1) / (z + 1)</span>
    </div>
  </header>

  <main>
    <section class="control-panel" aria-labelledby="import-title">
      <div class="section-heading">
        <div>
          <p class="step">01 · 数据</p>
          <h2 id="import-title">导入测量文件</h2>
        </div>
        <span id="privacy-badge" class="privacy-badge">仅本机处理</span>
      </div>

      <label id="drop-zone" class="drop-zone" for="file-input">
        <input id="file-input" type="file" accept=".xlsx,.xlsm,.xls,.csv,.txt,.tsv">
        <span class="upload-mark">↑</span>
        <strong>拖入文件或点击选择</strong>
        <span>Excel / CSV / TXT，最大 25 MB</span>
      </label>

      <div id="status" class="status" aria-live="polite">等待导入数据</div>

      <div class="settings">
        <label>
          <span>计算模式</span>
          <select id="calculation-mode">
            <option value="intrinsic">材料本征阻抗</option>
            <option value="layer">有限厚度吸波层（金属背板）</option>
          </select>
        </label>
        <label id="thickness-field" hidden>
          <span>吸波介质厚度（mm）</span>
          <input id="thickness-mm" type="number" min="0.001" step="0.01" value="3.37">
        </label>
        <label>
          <span>虚部约定</span>
          <select id="sign-convention">
            <option value="minus">ε = ε′ − jε″，μ = μ′ − jμ″</option>
            <option value="plus">ε = ε′ + jε″，μ = μ′ + jμ″</option>
          </select>
        </label>
        <label>
          <span>频率单位</span>
          <select id="frequency-unit">
            <option value="GHz">GHz</option>
            <option value="MHz">MHz</option>
            <option value="Hz">Hz</option>
          </select>
        </label>
      </div>

      <div id="summary" class="summary" hidden>
        <div><span>有效点数</span><strong id="point-count">—</strong></div>
        <div><span>频率范围</span><strong id="frequency-range">—</strong></div>
        <div><span>已忽略行</span><strong id="ignored-rows">—</strong></div>
      </div>

      <div class="export-block">
        <p class="step">02 · 导出</p>
        <div class="button-grid">
          <button id="export-csv" disabled>Origin CSV</button>
          <button id="export-txt" disabled>Origin TXT</button>
          <button id="export-svg" disabled>SVG 图</button>
          <button id="export-png" disabled>PNG 图</button>
        </div>
      </div>
    </section>

    <section class="chart-panel" aria-labelledby="chart-title">
      <div class="section-heading chart-heading">
        <div>
          <p class="step">03 · 结果</p>
          <h2 id="chart-title">归一化本征阻抗轨迹</h2>
        </div>
        <div class="legend"><span></span><span>频率由低到高</span></div>
      </div>
      <div id="chart-wrap" class="chart-wrap">
        <svg id="smith-chart" role="img" aria-label="Smith 圆图"></svg>
        <div id="empty-state" class="empty-state">
          <span class="empty-orbit"></span>
          <strong>尚未载入数据</strong>
          <span>导入文件后，这里将显示频率轨迹</span>
        </div>
        <div id="tooltip" class="tooltip" hidden></div>
      </div>
      <div class="chart-footer">
        <span>红色十字：自由空间匹配点 z = 1 + j0</span>
        <span id="impedance-range">z′ / z″：—</span>
      </div>
    </section>
  </main>

  <footer id="model-note">本征模式用于材料与自由空间的固有阻抗匹配分析。</footer>
  <script src="xlsx.full.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
